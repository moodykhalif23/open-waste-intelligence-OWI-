name: owi

x-owi-env: &owi-env
  OWI_ENVIRONMENT: production
  OWI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  OWI_REDIS_URL: &redis-url redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (see example.env)}@redis:6379/0
  OWI_STORAGE_DRIVER: s3
  OWI_S3_ENDPOINT: garage:3900
  OWI_S3_REGION: garage
  OWI_S3_ACCESS_KEY: ${OWI_S3_ACCESS_KEY}
  OWI_S3_SECRET_KEY: ${OWI_S3_SECRET_KEY}
  OWI_JWT_SECRET: ${OWI_JWT_SECRET}
  OWI_ADMIN_PHONE: ${OWI_ADMIN_PHONE:-}
  OWI_ADMIN_PASSWORD: ${OWI_ADMIN_PASSWORD:-}
  OWI_ADMIN_NAME: ${OWI_ADMIN_NAME:-Admin}
  OWI_ORG_NAME: ${OWI_ORG_NAME:-}
  OWI_CORS_ORIGINS: ${OWI_CORS_ORIGINS:-[]}
  OWI_OSRM_URL: ${OWI_OSRM_URL:-http://osrm:5000}
  OWI_FUEL_PRICE_KES_PER_L: ${OWI_FUEL_PRICE_KES_PER_L:-0}
  OWI_PUBLIC_API_DELAY_DAYS: ${OWI_PUBLIC_API_DELAY_DAYS:-7}
  OWI_PUBLIC_API_RATE_PER_MIN: ${OWI_PUBLIC_API_RATE_PER_MIN:-60}
  # Notification providers (unset = console/log provider).
  OWI_NOTIFY_CHANNEL: ${OWI_NOTIFY_CHANNEL:-sms}
  OWI_AT_USERNAME: ${OWI_AT_USERNAME:-}
  OWI_AT_API_KEY: ${OWI_AT_API_KEY:-}
  OWI_AT_SENDER_ID: ${OWI_AT_SENDER_ID:-}
  OWI_WA_TOKEN: ${OWI_WA_TOKEN:-}
  OWI_WA_PHONE_NUMBER_ID: ${OWI_WA_PHONE_NUMBER_ID:-}

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (see example.env)}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (see example.env)}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3903:3903"
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 3s
      retries: 12

  labelstudio:
    image: heartexlabs/label-studio:latest@sha256:aa461572e8f9d86a1bf9520c1db620204e86160fd2f80dd7e9d40ac84a8828ea
    restart: unless-stopped
    environment:
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD}
      LABEL_STUDIO_USER_TOKEN: ${LABEL_STUDIO_USER_TOKEN}
      # Scripted access uses the preset token above; JWT PATs stay available in the UI.
      LABEL_STUDIO_LEGACY_API_TOKENS_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ls-data:/label-studio/data

  migrate:
    build: ./api
    profiles: [prod]
    environment:
      <<: *owi-env
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    command: sh -c "uv run alembic upgrade head && uv run python -m owi_api.bootstrap && uv run python scripts/garage_init.py"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy

  api:
    build: ./api
    profiles: [prod]
    restart: unless-stopped
    environment: *owi-env
    command: uv run uvicorn owi_api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips 172.16.240.10
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy

  worker:
    build: ./api
    profiles: [prod]
    restart: unless-stopped
    environment:
      <<: *owi-env
      RQ_REDIS_URL: *redis-url
    command: uv run rq worker inference
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    build: ./api
    profiles: [prod]
    restart: unless-stopped
    environment: *owi-env
    command: uv run python -m owi_api.scheduler
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Nightly Postgres dumps with rotation into ./var/backups/postgres (gitignored).
  # Manual run: docker compose exec db-backup /backup.sh — restore via `make restore`.
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    profiles: [prod]
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
      BACKUP_KEEP_WEEKS: "8"
      BACKUP_KEEP_MONTHS: "6"
    volumes:
      - ./var/backups/postgres:/backups
    depends_on:
      db:
        condition: service_healthy

  garage-backup:
    image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    profiles: [prod]
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - >
        while true; do
        rclone sync src:${OWI_S3_BUCKET:-owi-images} /backups/${OWI_S3_BUCKET:-owi-images} --exclude "quarantine/**";
        sleep 86400;
        done
    environment:
      RCLONE_CONFIG_SRC_TYPE: s3
      RCLONE_CONFIG_SRC_PROVIDER: Other
      RCLONE_CONFIG_SRC_ENDPOINT: http://garage:3900
      RCLONE_CONFIG_SRC_REGION: garage
      RCLONE_CONFIG_SRC_ACCESS_KEY_ID: ${OWI_S3_ACCESS_KEY}
      RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY: ${OWI_S3_SECRET_KEY}
    volumes:
      - ./var/backups/garage:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully

  osrm-download:
    image: curlimages/curl:8.11.1
    profiles: [prod]
    restart: "no"
    user: root
    command: >
      sh -c "test -f /data/region.osm.pbf ||
      curl -L --fail -o /data/region.osm.pbf
      ${OSRM_PBF_URL:-https://download.geofabrik.de/africa/kenya-latest.osm.pbf}"
    volumes:
      - ./var/osrm:/data

  osrm-prepare:
    image: osrm/osrm-backend:v5.25.0
    profiles: [prod]
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - >
        test -f /data/.prepared ||
        (osrm-extract -p /opt/car.lua /data/region.osm.pbf &&
        osrm-partition /data/region.osrm &&
        osrm-customize /data/region.osrm &&
        touch /data/.prepared)
    volumes:
      - ./var/osrm:/data
    depends_on:
      osrm-download:
        condition: service_completed_successfully

  osrm:
    image: osrm/osrm-backend:v5.25.0
    profiles: [prod]
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/region.osrm
    volumes:
      - ./var/osrm:/data
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully

  tiles:
    image: protomaps/go-pmtiles:v1.31.2@sha256:06574f01f55a78f78f887bc7ebf729a5c093c0d6e17d9876300cfcb0758b59d3
    profiles: [prod]
    restart: unless-stopped
    command: ["serve", "/data"]
    read_only: true
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./var/tiles:/data:ro
    networks:
      - default
      - edge

  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    profiles: [edge]
    restart: unless-stopped
    environment:
      OWI_APP_DOMAIN: ${OWI_APP_DOMAIN:-app.localhost}
      OWI_DASH_DOMAIN: ${OWI_DASH_DOMAIN:-dash.localhost}
      OWI_SITE_DOMAIN: ${OWI_SITE_DOMAIN:-site.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ./app/dist
        target: /srv/app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./dash/dist
        target: /srv/dash
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./site/dist
        target: /srv/site
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.16.240.10
    depends_on:
      api:
        condition: service_started
        required: false

networks:
  edge:
    ipam:
      config:
        - subnet: 172.16.240.0/28
          ip_range: 172.16.240.0/29

volumes:
  db-data:
  garage-meta:
  garage-data:
  ls-data:
  caddy-data:
  caddy-config:
